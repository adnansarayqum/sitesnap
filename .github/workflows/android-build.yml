name: Android build

on:
  push:
    branches: [main, claude/new-session-idpxy6]
    paths:
      - "android/**"
      - "src/**"
      - "capacitor.config.ts"
      - "package.json"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "android/**"
      - "src/**"
      - "capacitor.config.ts"
      - "package.json"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # the Capacitor CLI itself requires Node >=22, independent of the
          # app's own runtime requirement (engines.node in package.json,
          # which stays >=20.19 for the deployed server)
          node-version: "22"
          cache: "npm"

      - uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"

      - run: npm ci
      - run: npm run build
      - run: npx cap sync android

      # Produces a debug-signed, installable APK — good for sideloading and
      # confirming the native project still builds on every change. A real
      # Play Store submission needs a release build signed with your own
      # upload key; see docs/app-store-submission.md for adding that as a
      # second job here once you have a keystore.
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: sitesnap-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
