name: iOS build

on:
  push:
    branches: [main, claude/new-session-idpxy6]
    paths:
      - "ios/**"
      - "src/**"
      - "capacitor.config.ts"
      - "package.json"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "ios/**"
      - "src/**"
      - "capacitor.config.ts"
      - "package.json"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: "npm"

      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios

      - name: Install CocoaPods dependencies
        working-directory: ios/App
        run: pod install

      # Builds for the Simulator only — no Apple signing certificate is
      # needed for this, so it works with zero secrets configured. This
      # confirms the native project actually compiles on every change; it is
      # NOT an App Store-submittable build. A real archive/IPA needs your
      # Apple Developer signing certificate and provisioning profile added
      # as repo secrets — see docs/app-store-submission.md.
      - name: Build for iOS Simulator
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -configuration Debug build CODE_SIGNING_ALLOWED=NO
