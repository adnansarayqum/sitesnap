name: iOS build

on:
  push:
    branches: [main, claude/new-session-idpxy6]
    paths:
      - "ios/**"
      - "src/**"
      - "capacitor.config.ts"
      - "package.json"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "ios/**"
      - "src/**"
      - "capacitor.config.ts"
      - "package.json"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # the Capacitor CLI itself requires Node >=22, independent of the
          # app's own runtime requirement (engines.node in package.json,
          # which stays >=20.19 for the deployed server)
          node-version: "22"
          cache: "npm"

      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios

      # This project's plugins resolve via Swift Package Manager (see
      # ios/App/CapApp-SPM/Package.swift), Capacitor's default since 8.x —
      # there's no Podfile and no .xcworkspace to install or open; xcodebuild
      # resolves the SPM dependencies itself against the .xcodeproj.
      #
      # Builds for the Simulator only — no Apple signing certificate is
      # needed for this, so it works with zero secrets configured. This
      # confirms the native project actually compiles on every change; it is
      # NOT an App Store-submittable build. A real archive/IPA needs your
      # Apple Developer signing certificate and provisioning profile added
      # as repo secrets — see docs/app-store-submission.md.
      - name: Build for iOS Simulator
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -configuration Debug build CODE_SIGNING_ALLOWED=NO
