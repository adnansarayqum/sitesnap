name: CI

on:
  push:
    branches: [main, claude/new-session-idpxy6]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20.19"
          cache: "npm"

      - run: npm ci

      # fails the build on a new high/critical finding; moderate-and-below
      # (e.g. a dev-only tool with no fix yet) doesn't block shipping but
      # still shows up in the log for anyone reading it
      - run: npm audit --audit-level=high

      - run: npm test

      - run: npm run build

      - name: Install smoke-test browser
        run: npx playwright-core install --with-deps chromium

      - name: Production server and offline PWA smoke
        run: npm run test:e2e:smoke
