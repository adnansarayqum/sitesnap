name: CI

on:
  push:
    branches: [main, claude/new-session-idpxy6]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: "npm"

      - run: npm ci

      - run: npm test

      - run: npm run build
