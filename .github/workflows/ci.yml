name: CI

on:
  push:
    branches: [main, claude/new-session-idpxy6]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: "npm"

      - run: npm ci

      # fails the build on a new high/critical finding; moderate-and-below
      # (e.g. a dev-only tool with no fix yet) doesn't block shipping but
      # still shows up in the log for anyone reading it
      - run: npm audit --audit-level=high

      - run: npm test

      - run: npm run build
